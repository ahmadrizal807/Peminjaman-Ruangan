    <style>
        @keyframes slideDown {
            from { transform: translate(-50%, -150%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #004A98; border-radius: 10px; }

<body class="bg-gray-50 font-sans text-gray-800 pb-20 antialiased min-h-screen">

    <div id="notification" class="fixed top-4 left-1/2 transform -translate-x-1/2 text-white px-5 py-3 rounded-2xl shadow-xl hidden z-50 flex items-center justify-between min-w-[300px] border">
        <div class="flex items-center">
            <i id="notif-icon" class="fas mr-3 text-xl"></i>
            <span id="notif-message" class="font-medium text-sm">Pesan Notifikasi</span>
        </div>
        <button onclick="closeNotif()" class="text-white hover:text-gray-200 ml-4 focus:outline-none">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden items-center justify-center animate-fade-in px-4">

            <div class="text-center mb-5">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-4">
                    <i class="fas fa-exclamation-triangle text-2xl text-red-600"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-900">Batalkan Reservasi?</h3>
                <p class="text-sm text-gray-500 mt-2">Apakah Anda yakin ingin menghapus jadwal peminjaman ruangan ini?</p>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeDeleteModal()" class="flex-1 bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50 font-bold py-3 rounded-xl transition-colors">Kembali</button>
                <button id="confirmDeleteBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">Ya, Hapus</button>
            </div>
        </div>
    </div>

            <p class="text-xs font-semibold text-gray-500 mb-2">Pilih jam</p>
            <div class="flex items-center justify-center gap-1 mb-3 text-4xl font-bold text-gray-800">
                <button type="button" id="jamBtnH" class="px-3 py-1 rounded-xl">00</button>
                <span>:</span>
                <button type="button" id="jamBtnM" class="px-3 py-1 rounded-xl">00</button>
            </div>
            <svg id="jamDial" viewBox="0 0 256 256" class="w-64 h-64 mx-auto select-none cursor-pointer" style="touch-action:none"></svg>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" id="jamBatal" class="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-xl">Batal</button>
                <button type="button" id="jamOk" class="px-5 py-2 text-sm font-bold text-white bg-bi-blue rounded-xl shadow">OK</button>
            </div>
        </div>
    </div>
<!-- Modal Jam Bulat Analog -->
<div id="modalJam" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-72 overflow-hidden">
        <div class="bg-bi-blue text-white p-4 text-center">
            <p id="labelModalJam" class="text-xs uppercase tracking-wider opacity-80 mb-1">Pilih Jam</p>
            <div class="text-3xl font-bold flex justify-center items-center gap-1">
                <span id="dispJam" onclick="setModeJam('jam')" class="cursor-pointer px-2 py-0.5 rounded bg-white/20">08</span>
                <span>:</span>
                <span id="dispMenit" onclick="setModeJam('menit')" class="cursor-pointer px-2 py-0.5 rounded opacity-70">00</span>
            </div>
        </div>
        <div class="p-5 flex justify-center">
            <div id="piringanJam" class="relative w-56 h-56 rounded-full bg-gray-100 border border-gray-200 select-none">
                <div class="w-2.5 h-2.5 bg-bi-blue rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20"></div>
                <div id="jarumJam" class="absolute bottom-1/2 left-1/2 w-0.5 bg-bi-blue origin-bottom z-10 transition-transform duration-200" style="height: 82px; transform: translateX(-50%) rotate(0deg);"></div>
            </div>
        </div>
        <div class="flex border-t border-gray-100">
            <button type="button" onclick="tutupJamAnalog()" class="flex-1 py-3 text-sm font-semibold text-gray-500 hover:bg-gray-50">Batal</button>
            <button type="button" onclick="simpanJamAnalog()" class="flex-1 py-3 text-sm font-bold text-bi-blue hover:bg-blue-50 border-l border-gray-100">OK</button>
        </div>
    </div>
</div>
    <script>
        // GANTI dengan URL Web App dari Google Apps Script (berakhiran /exec)
        const API_URL = 'https://script.google.com/macros/s/AKfycbwMSVCFOryyycqFNX35VVRMMRrpCYiMumSpylmeTld0QCVSRG7t0QSSfBnahUcR66hbeQ/exec';

        let dataBooking = [];
        let sedangKirim = false;

        function esc(t) {
            return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function apiSiap() {
            if (!API_URL || API_URL.startsWith('PASTE')) {
                showNotif('URL database belum diatur.', 'error');
                return false;
            }
            return true;
        }

        async function kirim(payload) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        async function muatData(tampilNotif) {
            if (!apiSiap()) return;
            const ikon = document.getElementById('iconRefresh');
            if (ikon) ikon.classList.add('fa-spin');
            try {
                const res = await fetch(API_URL);
                const hasil = await res.json();
                if (hasil.ok) {
                    dataBooking = hasil.data;
                    tampilkanData();
                    if (tampilNotif) showNotif('Jadwal diperbarui.', 'info');
                }
            } catch (err) {
                showNotif('Gagal memuat data. Cek koneksi internet.', 'error');
            } finally {
                if (ikon) ikon.classList.remove('fa-spin');
            }
        }
        let notifTimeout;
        let idToDelete = null;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const tanggalInput = document.getElementById('tanggal');
            tanggalInput.setAttribute('min', today);
            tanggalInput.addEventListener('input', updateTanggalTampil);
            tanggalInput.addEventListener('change', updateTanggalTampil);
           

            muatData(false);
        });

// --- MESIN JAM BULAT ANALOG ---
 let targetInputJam = null;
 let modeJam = 'jam';
 let jamTerpilih = '08';
 let menitTerpilih = '00';

 function bukaJamAnalog(idInput) {
     targetInputJam = idInput;
     const val = document.getElementById(idInput).value;
     if (val && val.includes(':')) {
         [jamTerpilih, menitTerpilih] = val.split(':');
     } else {
         jamTerpilih = '08';
         menitTerpilih = '00';
     }
     document.getElementById('labelModalJam').innerText = idInput === 'waktuMulai' ? 'Jam Mulai' : 'Jam Selesai';
     document.getElementById('modalJam').classList.remove('hidden');
     setModeJam('jam');
 }

 function tutupJamAnalog() {
     document.getElementById('modalJam').classList.add('hidden');
 }

 function setModeJam(mode) {
     modeJam = mode;
     document.getElementById('dispJam').innerText = jamTerpilih;
     document.getElementById('dispMenit').innerText = menitTerpilih;
     document.getElementById('dispJam').className = mode === 'jam' ? 'cursor-pointer px-2 py-0.5 rounded bg-white/20' : 'cursor-pointer px-2 py-0.5 rounded opacity-70';
     document.getElementById('dispMenit').className = mode === 'menit' ? 'cursor-pointer px-2 py-0.5 rounded bg-white/20' : 'cursor-pointer px-2 py-0.5 rounded opacity-70';
     gambarAngkaJam();
 }

 function gambarAngkaJam() {
     const piringan = document.getElementById('piringanJam');
     piringan.querySelectorAll('.angka-jam').forEach(el => el.remove());

     if (modeJam === 'jam') {
         for (let i = 1; i <= 24; i++) {
             const angka = i === 24 ? '00' : String(i).padStart(2, '0');
             const isDalam = i > 12;
             const pos = i % 12 === 0 ? 12 : i % 12;
             const sudut = (pos * 30 - 90) * (Math.PI / 180);
             const radius = isDalam ? 60 : 92;
             buatTitikAngka(piringan, angka, sudut, radius, isDalam ? 'text-xs' : 'text-sm font-semibold', () => {
                 jamTerpilih = angka;
                 setModeJam('menit');
             });
         }
         const valJam = parseInt(jamTerpilih, 10);
         const posJam = valJam % 12 === 0 ? 12 : valJam % 12;
         const isDalam = valJam === 0 || valJam > 12;
         const jarum = document.getElementById('jarumJam');
         jarum.style.height = isDalam ? '52px' : '82px';
         jarum.style.transform = `translateX(-50%) rotate(${posJam * 30}deg)`;
     } else {
         for (let i = 0; i < 12; i++) {
             const menit = String(i * 5).padStart(2, '0');
             const sudut = (i * 30 - 90) * (Math.PI / 180);
             buatTitikAngka(piringan, menit, sudut, 92, 'text-sm font-semibold', () => {
                 menitTerpilih = menit;
                 setModeJam('menit');
             });
         }
         const valMenit = parseInt(menitTerpilih, 10);
         const jarum = document.getElementById('jarumJam');
         jarum.style.height = '82px';
         jarum.style.transform = `translateX(-50%) rotate(${valMenit * 6}deg)`;
     }
 }

 function buatTitikAngka(container, teks, sudut, radius, kelasTeks, onClick) {
     const btn = document.createElement('button');
     btn.type = 'button';
     const aktif = (modeJam === 'jam' && teks === jamTerpilih) || (modeJam === 'menit' && teks === menitTerpilih);
     btn.className = `angka-jam absolute w-8 h-8 -ml-4 -mt-4 rounded-full flex items-center justify-center transition-colors ${kelasTeks} ${aktif ? 'bg-bi-blue text-white font-bold z-20' : 'text-gray-700 hover:bg-blue-100'}`;
     btn.style.left = `${112 + radius * Math.cos(sudut)}px`;
     btn.style.top = `${112 + radius * Math.sin(sudut)}px`;
     btn.innerText = teks;
     btn.onclick = onClick;
     container.appendChild(btn);
 }

 function simpanJamAnalog() {
     if (targetInputJam) {
         document.getElementById(targetInputJam).value = `${jamTerpilih}:${menitTerpilih}`;
     }
     tutupJamAnalog();
 }
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (sedangKirim || !apiSiap()) return;
			const wMulai = document.getElementById('waktuMulai').value;
        const wSelesai = document.getElementById('waktuSelesai').value;
        if (!wMulai || !wSelesai) {
            showNotif('Harap pilih Jam Mulai dan Jam Selesai!', 'error');
            return;
        }
        if (wSelesai <= wMulai) {
            showNotif('Jam selesai harus lebih akhir dari jam mulai!', 'error');
            return;
        }

            const form = this;
            const tombol = form.querySelector('button[type="submit"]');
            const labelAsli = tombol.innerHTML;
            sedangKirim = true;
            tombol.disabled = true;
            tombol.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...';

            try {
                const hasil = await kirim({
                    action: 'add',
                    nama: document.getElementById('nama').value.trim(),
                    ruangan: document.getElementById('ruangan').value,
                    tanggal: document.getElementById('tanggal').value,
                    waktu: `${wMulai} - ${wSelesai}`,
                    kegiatan: document.getElementById('kegiatan').value.trim()
                });
                if (hasil.data) {
                    dataBooking = hasil.data;
                    tampilkanData();
                }
                if (hasil.ok) {
                    showNotif('Reservasi berhasil disimpan!', 'success');
                    form.reset();
                    updateTanggalTampil();
                    
                } else {
                    showNotif(hasil.error || 'Gagal menyimpan.', 'error');
                }
            } catch (err) {
                showNotif('Gagal terhubung ke server. Coba lagi.', 'error');
            } finally {
                sedangKirim = false;
                tombol.disabled = false;
                tombol.innerHTML = labelAsli;
            }
        });

        
            
         // Di PC, klik di mana saja pada kolom tanggal langsung membuka kalender
    const elTanggal = document.getElementById('tanggal');
    if (elTanggal) {
        elTanggal.addEventListener('click', function() {
            try { if (elTanggal.showPicker) elTanggal.showPicker(); } catch (err) {}
        });
    }  

        const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

        // Ubah "2026-11-27" menjadi "27 November 2026"
        function formatTanggal(str) {
            const [y, m, d] = str.split('-').map(Number);
            return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
        }

        function updateTanggalTampil() {
            const val = document.getElementById('tanggal').value;
            const el = document.getElementById('tanggalTampil');
            if (val) {
                el.textContent = formatTanggal(val);
                el.className = 'text-gray-800 whitespace-nowrap';
            } else {
                el.textContent = 'Pilih tanggal';
                el.className = 'text-gray-400 whitespace-nowrap';
            }
        }

        // Tampilkan jam format 24 jam, misal "14:30"
        function updateWaktuTampil() {
            const val = document.getElementById('waktu').value;
            const el = document.getElementById('waktuTampil');
            if (val) {
                el.textContent = val + ' WIB';
                el.className = 'text-gray-800 whitespace-nowrap';
            } else {
                el.textContent = 'Pilih jam';
                el.className = 'text-gray-400 whitespace-nowrap';
            }
        }

        function tampilkanData() {
            const wadah = document.getElementById('daftarBooking');
            const pesanKosong = document.getElementById('pesanKosong');
            const badgeCount = document.getElementById('badge-count');

            wadah.innerHTML = '';
            badgeCount.innerText = dataBooking.length;

            if (dataBooking.length === 0) {
                wadah.appendChild(pesanKosong);
                pesanKosong.style.display = 'block';
                return;
            }

            const sortedData = [...dataBooking].sort((a, b) => {
                return new Date(`${a.tanggal}T${a.waktu}`) - new Date(`${b.tanggal}T${b.waktu}`);
            });

            sortedData.forEach(booking => {
                const tglFormat = formatTanggal(booking.tanggal);

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative border-l-[6px] border-l-bi-blue flex flex-col gap-3";

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-3">
                            <span class="inline-block bg-blue-50 text-bi-blue text-[11px] uppercase tracking-wider font-bold px-3 py-1.5 rounded-lg mb-2">${esc(booking.ruangan)}</span>
                            <h3 class="text-base font-bold text-gray-800 mb-1">
                                <i class="fas fa-user-circle text-gray-400 mr-1.5 text-sm"></i>${esc(booking.nama)}
                            </h3>
                            <div class="mt-3 bg-gray-50 px-4 py-3 rounded-xl border border-gray-100">
                                <p class="text-sm text-gray-600 italic leading-relaxed">"${esc(booking.kegiatan)}"</p>
                            </div>
                        </div>
                        <button onclick="openDeleteModal('${booking.id}')" class="text-gray-300 hover:text-red-500 hover:bg-red-50 p-3 rounded-xl transition-all" title="Hapus Reservasi">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div class="flex items-center text-xs font-semibold text-bi-blue bg-blue-50/50 p-3 rounded-xl mt-2">
                        <div class="flex items-center w-1/2">
                            <i class="fas fa-calendar-day mr-2 text-blue-300"></i> ${tglFormat}
                        </div>
                        <div class="flex items-center w-1/2 border-l border-blue-100 pl-4">
                            <i class="fas fa-clock mr-2 text-blue-300"></i> ${booking.waktu} WIB
                        </div>
                    </div>
                `;
                wadah.appendChild(card);
            });
        }

        function openDeleteModal(id) {
            idToDelete = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            idToDelete = null;
            document.getElementById('deleteModal').style.display = 'none';
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
            if (!idToDelete || !apiSiap()) return;
            const id = idToDelete;
            closeDeleteModal();
            try {
                const hasil = await kirim({ action: 'delete', id: id });
                if (hasil.ok) {
                    dataBooking = hasil.data;
                    tampilkanData();
                    showNotif('Reservasi berhasil dihapus.', 'info');
                } else {
                    showNotif(hasil.error || 'Gagal menghapus.', 'error');
                }
            } catch (err) {
                showNotif('Gagal terhubung ke server. Coba lagi.', 'error');
            }
        });

        function showNotif(pesan, tipe) {
            const notif = document.getElementById('notification');
            const pesanEl = document.getElementById('notif-message');
            const iconEl = document.getElementById('notif-icon');

            clearTimeout(notifTimeout);
            pesanEl.innerText = pesan;

            notif.classList.remove('hidden', 'bg-green-600', 'bg-red-600', 'bg-gray-800', 'border-green-500', 'border-red-500', 'border-gray-700');
            notif.classList.add('animate-slide-down');

            if (tipe === 'success') {
                notif.classList.add('bg-green-600', 'border-green-500');
                iconEl.className = 'fas fa-check-circle mr-3 text-xl';
            } else if (tipe === 'error') {
                notif.classList.add('bg-red-600', 'border-red-500');
                iconEl.className = 'fas fa-exclamation-circle mr-3 text-xl';
            } else {
                notif.classList.add('bg-gray-800', 'border-gray-700');
                iconEl.className = 'fas fa-info-circle mr-3 text-xl';
            }

            notif.style.display = 'flex';
            notifTimeout = setTimeout(() => closeNotif(), 3000);
        }

        function closeNotif() {
            const notif = document.getElementById('notification');
            notif.style.display = 'none';
            notif.classList.remove('animate-slide-down');
        }
    </script>
